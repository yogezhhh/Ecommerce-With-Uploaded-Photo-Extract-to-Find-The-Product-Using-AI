{# order_success.html #}
{% extends 'shop/base.html' %}
{% block content %}
<section class="pt-32 pb-24 px-6 max-w-2xl mx-auto text-center">
  <div class="text-7xl mb-6">🎉</div>
  <h1 class="text-4xl font-bold font-[Space_Grotesk] mb-4">Order Confirmed!</h1>
  <p class="text-white/60 mb-8">Order #{{ order.id }} — Total ${{ order.total }}</p>
  <a href="/products/" class="btn-primary">Continue shopping</a>
</section>
{% endblock %}
