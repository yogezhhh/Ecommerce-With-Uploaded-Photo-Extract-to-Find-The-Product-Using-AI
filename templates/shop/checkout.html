{% extends 'shop/base.html' %}

{% block content %}
<section class="pt-32 pb-24 px-6 max-w-4xl mx-auto grid md:grid-cols-2 gap-10">
  <div>
    <div class="text-cyan-400 text-sm mb-2">/ CHECKOUT</div>
    <h1 class="text-4xl font-bold font-[Space_Grotesk] mb-8">Shipping</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="text-sm text-white/60 mb-1 block">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
      <button class="btn-primary w-full mt-4">Place Order →</button>
    </form>
  </div>

  <div class="glass rounded-2xl p-6 h-fit">
    <div class="text-sm text-white/50 mb-4">Order summary</div>
    {% for item in cart %}
      <div class="flex justify-between text-sm py-2 border-b border-white/5">
        <span>{{ item.product.name }} × {{ item.qty }}</span>
        <span class="text-cyan-400">${{ item.subtotal }}</span>
      </div>
    {% endfor %}
    <div class="flex justify-between mt-4 text-lg font-bold">
      <span>Total</span>
      <span class="text-cyan-400">${{ cart.total }}</span>
    </div>
  </div>
</section>
{% endblock %}
