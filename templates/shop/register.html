{# register.html #}
{% extends 'shop/base.html' %}
{% block content %}
<section class="pt-32 pb-24 px-6 max-w-md mx-auto">
  <div class="glass rounded-3xl p-8">
    <h1 class="text-3xl font-bold font-[Space_Grotesk] mb-6 text-center">Create account</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for f in form %}
        <input name="{{ f.name }}" placeholder="{{ f.label }}" class="field" required>
      {% endfor %}
      <button class="btn-primary w-full">Register</button>
    </form>
    <p class="text-center text-white/40 text-sm mt-6">
      Already have an account? <a href="/login/" class="text-cyan-400 hover:underline">Login</a>
    </p>
  </div>
</section>
{% endblock %}
