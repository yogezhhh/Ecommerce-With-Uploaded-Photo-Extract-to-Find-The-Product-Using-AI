{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NOVA — Future of Shopping{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="bg-[#0a0a0f] text-white font-[Inter] antialiased overflow-x-hidden">

  {% include 'shop/partials/navbar.html' %}

  <main class="relative z-10">
    {% block content %}{% endblock %}
  </main>

  {% include 'shop/partials/footer.html' %}

  <script src="{% static 'js/animations.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
